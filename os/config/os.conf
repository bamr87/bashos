# bashOS machine settings — the shipped defaults.
#
# `bashos os install` copies this file to /etc/bashos/os.conf once and never overwrites it, so
# that copy is the machine's (edit it there). ~/.config/bashos/os.conf overrides it per user.
# Plain KEY=value shell; read in that order by os/lib.sh os_conf_load.

# --- console: the physical monitor -------------------------------------------------------
# One shared tmux session, shown on the monitor and joined by every ssh login; every window is
# a view of it. On Debian, tty1 auto-logs in BASHOS_USER and attaches it.
#   auto     on Amrchy: desktop. On Debian: a Wayland kiosk (cage + foot: truecolor, real fonts)
#            when a GPU and both are present, else the plain Linux console
#   desktop  Amrchy's desktop: the console opens in a terminal window at login and the app
#            launcher lists it; tty1 stays the login screen's
#   kiosk    the kiosk, falling back to the plain console if it cannot start
#   vt       the plain Linux console only
#   off      leave tty1 and the desktop alone
BASHOS_CONSOLE=auto
BASHOS_CONSOLE_SESSION=console
# Interactive ssh logins join the same session (escape hatch: ssh -t HOST NOTMUX=1 bash -l).
BASHOS_CONSOLE_SSH_JOIN=yes
BASHOS_CONSOLE_FONT="monospace:size=11"
# The monitor's orientation, in xrandr's words: normal | left (the picture turned 90 degrees
# counter-clockwise: a monitor stood on its right edge) | right (90 clockwise) | inverted.
# The kiosk turns its outputs with wlr-randr; the plain console turns with fbcon (a udev rule).
BASHOS_CONSOLE_ROTATE=normal
# Remote keyboard and mouse for the kiosk: wayvnc on 127.0.0.1, reached through ssh —
#   ssh -L 5901:127.0.0.1:5900 HOST, then open vnc://localhost:5901 (macOS Screen Sharing).
# Its account (Apple Diffie-Hellman, what Screen Sharing speaks) is ~/.config/bashos/wayvnc.conf.
BASHOS_CONSOLE_VNC=no
BASHOS_CONSOLE_VNC_PORT=5900

# --- the harness: the bamr87 hub's Harness Console ---------------------------------------
#   native   tools/console/run.sh from BASHOS_HUB_DIR, supervised by systemd (the default)
#   compose  the hub's `console` compose service (docker compose, compose/forge.yml overlay)
#   off      do not serve it
BASHOS_HARNESS=native
# A leading ~ is the user's home (this file is also read by root, with no $HOME).
BASHOS_HUB_DIR="~/dev/bamr87"
BASHOS_HUB_REPO=https://github.com/bamr87/bamr87
# Loopback by default: reach it with `ssh -L 4001:127.0.0.1:4001 HOST`. A LAN address also
# needs DASH_CONSOLE_TOKEN in ~/.config/bashos/harness.env, or bashos-harness refuses to start.
BASHOS_HARNESS_HOST=127.0.0.1
BASHOS_HARNESS_PORT=4001
# Only for a LAN bind on a machine running ufw: the subnet the port is opened to.
BASHOS_LAN_CIDR=

# --- the engine: OpenCode ----------------------------------------------------------------
# bashOS keeps its own root-owned OpenCode on npm's latest release, promoting a release only
# after `bashos opencode verify` proves it still enforces the tool policy (os/install/engine.sh).
#   daily  bashos-engine-update.timer runs `bashos os engine update` once a day (the default)
#   off    only `bashos os update` and `bashos os engine update` move it
BASHOS_ENGINE_UPDATE=daily

# --- the machine ---------------------------------------------------------------------------
# A dev box never sleeps (forge suspended itself mid-setup once; never again).
BASHOS_NEVER_SLEEP=yes
# Updates follow this branch of BASHOS_OS_REPO.
BASHOS_CHANNEL=main
