# bashOS machine settings — the shipped defaults.
#
# `bashos os install` copies this file to /etc/bashos/os.conf once and never overwrites it, so
# that copy is the machine's (edit it there). ~/.config/bashos/os.conf overrides it per user.
# Plain KEY=value shell; read in that order by os/lib.sh os_conf_load.

# --- console: the physical monitor -------------------------------------------------------
# tty1 auto-logs in BASHOS_USER and attaches the shared tmux session; every window is a view.
#   auto   a Wayland kiosk (cage + foot: truecolor, real fonts) when a GPU and both are present,
#          else the plain Linux console
#   kiosk  the kiosk, falling back to the plain console if it cannot start
#   vt     the plain Linux console only
#   off    leave tty1 alone
BASHOS_CONSOLE=auto
BASHOS_CONSOLE_SESSION=console
# Interactive ssh logins join the same session (escape hatch: ssh -t HOST NOTMUX=1 bash -l).
BASHOS_CONSOLE_SSH_JOIN=yes
BASHOS_CONSOLE_FONT="monospace:size=11"

# --- the harness: the bamr87 hub's Harness Console ---------------------------------------
#   native   tools/console/run.sh from BASHOS_HUB_DIR, supervised by systemd (the default)
#   compose  the hub's `console` compose service (docker compose, compose/forge.yml overlay)
#   off      do not serve it
BASHOS_HARNESS=native
BASHOS_HUB_DIR="$HOME/dev/bamr87"
BASHOS_HUB_REPO=https://github.com/bamr87/bamr87
# Loopback by default: reach it with `ssh -L 4001:127.0.0.1:4001 HOST`. A LAN address also
# needs DASH_CONSOLE_TOKEN in ~/.config/bashos/harness.env, or bashos-harness refuses to start.
BASHOS_HARNESS_HOST=127.0.0.1
BASHOS_HARNESS_PORT=4001
# Only for a LAN bind on a machine running ufw: the subnet the port is opened to.
BASHOS_LAN_CIDR=

# --- the machine ---------------------------------------------------------------------------
# A dev box never sleeps (forge suspended itself mid-setup once; never again).
BASHOS_NEVER_SLEEP=yes
# Updates follow this branch of BASHOS_OS_REPO.
BASHOS_CHANNEL=main
