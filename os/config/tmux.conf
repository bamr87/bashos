# bashOS tmux defaults — ~/.tmux.conf sources this first, so your own lines after it win.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,foot*:Tc"
# The console mirror: the size follows the most recently active client (the monitor or an ssh
# login). Without it the window latched onto a long-gone 327x40 client and btop refused to draw.
set -g window-size latest
setw -g aggressive-resize on
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[bold] #h #[default]| "
