# The root partition, as small as its contents at build time. On the first boot systemd-repart
# grows it to the end of the disk (mkosi.extra/usr/lib/repart.d) and GrowFileSystem makes
# systemd-growfs grow ext4 to match, so a 4 GB image written to forge's 1 TB disk becomes 1 TB.
[Partition]
Type=root
Format=ext4
CopyFiles=/
Minimize=guess
GrowFileSystem=yes
