# bashOS — the bootable image: Debian 13 with the bashOS layer already applied, for forge.
# Build with `bashos os image build` (os/image/build.sh): it stages the layer at /opt/bashos and
# adds the package lists from os/packages/. mkosi ≥ 25 (Debian 13: apt install mkosi).

[Distribution]
Distribution=debian
Release=trixie
# Debian's components beyond main: the firmware forge's NIC and GPU want.
Repositories=non-free-firmware

[Output]
ImageId=bashos
Format=disk

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
# The root partition is found by GPT auto-discovery; nothing names a disk.
KernelCommandLine=rw console=tty0
Hostname=bashos
Locale=C.UTF-8
RootShell=/bin/bash
WithDocs=no
Packages=
        systemd
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        systemd-timesyncd
        systemd-repart
        udev
        dbus
        dbus-user-session
        libpam-systemd
        kbd
        console-setup
        iputils-ping
        apt

[Build]
# The host's tools build it: Debian's mkosi package depends on every one (systemd-repart,
# systemd-ukify, mtools, dosfstools, e2fsprogs, …). No separate tools tree to download.
# The postinst installs the layer's virtualenv (pip) and the engine CLIs (npm).
WithNetwork=yes
