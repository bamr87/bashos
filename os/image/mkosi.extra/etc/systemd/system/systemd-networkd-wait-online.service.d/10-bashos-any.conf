# bashOS: the network is online once any wired link is routable. forge has two NICs and one
# cable; waiting for every managed link held each boot (and first-boot provisioning, which
# wants network-online) for the full 2-minute timeout and left the system degraded.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any
