# The bashOS ISO's builders, pinned to the day of the upstream Omarchy commit amrchy/ is synced to
# (quattro@175e63b6, 2026-11-01; amrchy/.upstream/ledger.tsv). The builder checks the source it is
# given against what it expects, so these move together with an amrchy upstream sync: take each
# repository's last commit before the synced upstream commit's day ends. Plain KEY=value lines.

# The ISO builder: archiso, the configurator, the installer, the cidata autoinstall.
OMARCHY_ISO_REPO=https://github.com/omacom/omarchy-iso.git
OMARCHY_ISO_COMMIT=ef1d3897f63f2e0104e461f7bf0d4bb0456168c9

# The package recipes: the runtime and settings packages are built from amrchy/ with them.
OMARCHY_PKGS_REPO=https://github.com/omacom/omarchy-pkgs.git
OMARCHY_PKGS_COMMIT=c1f46a344df9f20785a446334ab59d8e66b1230d

# The machine architecture the ISO installs (the builder also makes aarch64 images).
BASHOS_ISO_ARCH=x86_64
