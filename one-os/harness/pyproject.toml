[project]
name = "oneos-harness"
version = "0.1.0"
description = "QEMU test harness for the one-os stick"
requires-python = ">=3.11"
dependencies = ["pyyaml", "jsonschema", "pytest>=7", "pillow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "nightly: slow / interactive / large-download tests (nightly.yml only)",
  "vm: boots a QEMU VM",
  "network: needs outbound internet from the VM",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["oneos_harness"]
