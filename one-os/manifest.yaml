# manifest.yaml — every external artifact is pinned and checksummed.
# Paths under `file:` are relative to the root of the Ventoy data partition (P1).
schema: 1

ventoy:
  version: "1.1.18"
  url: "https://github.com/ventoy/Ventoy/releases/download/v1.1.18/ventoy-1.1.18-linux.tar.gz"
  sha256: "d86ff9de63d94c8b8f1f6b14d23c55af4b88e8207bf2893890892a6a97b1ad54"
  options:
    partition_style: gpt                 # Ventoy2Disk -g
    secure_boot: true                    # Ventoy2Disk -s
    reserve_mb: 8192                     # Ventoy2Disk -r: space after Ventoy for steamos.recovery_on_stick
  menu_timeout: 10
  windows11:                           # Ventoy's Windows 11 setup tweaks
    bypass_check: true                   # skip TPM 2.0 / Secure Boot / RAM / CPU checks
    bypass_nro: true                     # allow setup without a Microsoft account (local user)

steamos:
  # Valve's SteamOS recovery stick inside the reserved space: Ventoy → F6 → "SteamOS recovery"
  # boots Valve's own installer (scripts/stick-add-steamos.sh). Image: build/steamos/recovery.img,
  # else the newest cache/steamos/*.img.bz2 (make steamos-fetch). Needs reserve_mb >= 8192.
  recovery_on_stick: true

lightos:
  builder: live-build
  distribution: trixie                   # Debian 13
  architecture: amd64
  desktop: xfce                          # xfce | lxqt | none
  file: ISO/oneos-lightos.iso
  persistence_mb: 4096
  extra_packages: [gparted, network-manager, firmware-linux, debootstrap,
                   arch-install-scripts, curl, yq, smartmontools, testdisk]
  # Taken from <distribution>-backports instead (apt pin 990): new hardware needs a new kernel.
  # trixie's 6.12 lacks e.g. the Realtek RTL8127 10 GbE (ASUS X870E boards) and is early for RDNA4.
  backports: ["linux-image-*", "linux-headers-*", "linux-kbuild-*", "linux-base", "firmware-*",
              "amd64-microcode", "intel-microcode"]

# Phase 0 decisions (docs/spike.md):
# - netboot files live under /ISO so VTOY_DEFAULT_SEARCH_ROOT can stay at /ISO.
# - netboot.xyz.iso keeps its EFI loader only inside the El Torito image, which
#   Ventoy can't boot in UEFI mode. UEFI gets the standalone .efi, BIOS the .iso;
#   `mode` hides each file in the other firmware mode.
# - No separate -sb variant: after the one-time MOK enrollment Ventoy boots the
#   plain .efi under Secure Boot.
netboot:
  # SNP build: uses the firmware's network driver. The plain netboot.xyz.efi brings its own
  # drivers, which take the USB controller from the firmware on some boards (dead keyboard).
  - name: netboot.xyz-efi
    file: ISO/netboot.xyz-snp.efi
    url: "https://boot.netboot.xyz/ipxe/netboot.xyz-snp.efi"
    sha256: "f30777ff2dbaeb5643bc077a807ae9c77ccdf60fa54355cc4b54235791242c97"
    sha256_from: "https://boot.netboot.xyz/ipxe/netboot.xyz-sha256-checksums.txt"
    alias: "Network install (netboot.xyz)"
    mode: uefi
    ci: true
  - name: netboot.xyz-bios
    file: ISO/netboot.xyz.iso
    url: "https://boot.netboot.xyz/ipxe/netboot.xyz.iso"
    sha256: "5dbffcb3aa89bd322378ab7ee0bd278afe80d37777f9489fce4327413cf19f79"
    sha256_from: "https://boot.netboot.xyz/ipxe/netboot.xyz-sha256-checksums.txt"
    alias: "Network install (netboot.xyz)"
    mode: legacy
    ci: true

