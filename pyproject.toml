[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bashos"
version = "0.1.0"
description = "Terminal-first AI runtime: Claude slash commands routed through a LangGraph kernel onto the OpenCode engine, on Claude Code OAuth"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bamr87", email = "bamr87@users.noreply.github.com" }]
keywords = ["terminal", "ai", "shell", "opencode", "langgraph", "langchain", "claude", "agent", "repl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: System :: Shells",
  "Topic :: Terminals",
]
requires-python = ">=3.11"
dependencies = [
  # orchestration
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.0",
  # the engine: HTTP + SSE client for the local `opencode serve` process.
  # opencode itself is a node/bun binary, installed outside pip:
  #   npm i -g opencode-ai   (or: curl -fsSL https://opencode.ai/install | bash)
  "httpx>=0.27",
  # fallback model runtime (Claude Code OAuth harness, no tool policy)
  "claude-agent-sdk>=0.1.0",
  # terminal
  "typer>=0.27.1",
  "rich>=13.9",
  "prompt-toolkit>=3.0.48",
  # foundation
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
# observability: OpenInference spans exported to Arize Phoenix
trace = ["arize-phoenix-otel>=0.6", "openinference-instrumentation-langchain>=0.1.29"]

[project.urls]
Repository = "https://github.com/bamr87/bashos"
Documentation = "https://github.com/bamr87/bashos/blob/main/docs/HARNESS.md"
Issues = "https://github.com/bamr87/bashos/issues"

[project.scripts]
bashos = "bashos.shell.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bashos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
  "B008",  # typer's Option/Argument-in-default idiom
]

[tool.ruff.lint.isort]
known-first-party = ["bashos"]
