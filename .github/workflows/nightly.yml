name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  USE_DOCKER: "0"
  FETCH_LARGE: "1"

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    services:
      apt-cache:
        image: sameersbn/apt-cacher-ng:3.7.4-20220421
        ports: ["3142:3142"]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso mtools isolinux syslinux-common \
            qemu-system-x86 qemu-utils ovmf seabios ipxe-qemu exfatprogs exfat-fuse dosfstools e2fsprogs \
            parted gdisk rsync jq zstd python3-yaml python3-jinja2 python3-pytest python3-jsonschema python3-pil tesseract-ocr
          sudo modprobe nbd max_part=16
      - name: Free disk space for large ISOs
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - run: make fetch
      - run: make lightos payload image
      - name: Full matrix
        env:
          ONEUSB_MIRROR: http://localhost:3142/deb.debian.org/debian
        run: make test-full ARGS="-v --junitxml=build/junit.xml"
      - name: Package release candidate
        run: |
          tar -C build -I 'zstd -19 -T0' -cf build/payload.tar.zst payload
          (cd build && sha256sum payload.tar.zst oneusb-lightos.iso > SHA256SUMS && cat payload.SHA256SUMS >> SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: payload-rc-${{ github.run_number }}
          path: |
            build/payload.tar.zst
            build/SHA256SUMS
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-runs
          path: build/test-runs
          retention-days: 14

  bump:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-yaml jq
      - run: USE_DOCKER=0 make bump
      - name: Open PR if pins changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! cmp -s manifest.yaml build/manifest.bump.yaml; then
            git switch -c "bump/$(date +%Y%m%d)"
            cp build/manifest.bump.yaml manifest.yaml
            git -c user.name=oneusb-bot -c user.email=oneusb-bot@users.noreply.github.com commit -am "manifest: bump pins"
            git push -u origin HEAD
            gh pr create --fill --label bump
          fi
