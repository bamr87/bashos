name: Release

# Conventional Commits on main drive release-please (fleet standard, UPS-QA-32):
# every push to main opens or updates a release PR that bumps pyproject.toml,
# src/bashos/__init__.py and CHANGELOG.md. A human merges that PR; the push that
# merge makes tags vX.Y.Z and creates the GitHub release, and the publish jobs
# below run in the SAME run via `needs: release` on `release_created`. No
# tag-push trigger is involved, so the GITHUB_TOKEN "tags don't trigger
# workflows" rule never applies. RELEASE_PLEASE_TOKEN (a repo secret) opens the
# release PR, because this repo's Actions setting forbids GITHUB_TOKEN from
# creating pull requests.
#
# Recovery: `workflow_dispatch` with an existing tag re-runs the publish jobs
# for that tag without going through release-please.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    uses: bamr87/.github/.github/workflows/release-please.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit

  target:
    # One place that decides whether to publish and which tag, for both paths.
    name: resolve release tag
    needs: release
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.release.outputs.release_created == 'true') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        env:
          RELEASED_TAG: ${{ needs.release.outputs.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${RELEASED_TAG:-$INPUT_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::not a release tag: '$tag'"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: build sdist + wheel
    needs: target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    # release-please already created the release and its notes; this attaches
    # the built distributions to it (or creates it on a manual recovery run).
    name: attach dist to GitHub release
    needs: [target, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.target.outputs.tag }}
          files: dist/*

  pypi:
    # Requires a PyPI "trusted publisher" configured for this repo + workflow
    # (pypi.org → project → Publishing). Until then this job fails harmlessly
    # while the GitHub release above still completes.
    name: publish to PyPI
    needs: [target, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  ghcr:
    name: publish image to GHCR
    needs: target
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.target.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
