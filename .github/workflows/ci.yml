name: CI

# A thin caller of the fleet's one shared gate (UPS-QA-20): the install / test
# logic is versioned in bamr87/bamr87/.github/workflows/standard-ci.yml, pinned
# to its major tag (never @main). bashOS's own extra gates (ruff, shellcheck,
# compose config, the docker build) live beside it in bashos-checks.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: pytest (py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    uses: bamr87/bamr87/.github/workflows/standard-ci.yml@v2
    secrets: inherit
    with:
      python-version: ${{ matrix.python-version }}
      python-extras: dev
      # The desktop import smoke stays per Python version; pytest is the offline
      # suite (fake model, no auth) and includes the opencode.jsonc drift test;
      # node runs the GUI layout reducer tests (Node ships on ubuntu-latest).
      test-command: >-
        python -c "from bashos.desktop.app import BashOSApp"
        && pytest -q
        && node --test tests/shell.test.mjs
