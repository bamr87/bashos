name: one-os

# one-os (one-os/): lint, then build the home base, stage the stick image and run the fast
# harness suite in QEMU under KVM. Heavy, so it runs only when one-os moves, or by hand.
# The full matrix (large ISOs, nightly tests) is the `full` job: by hand only.
on:
  pull_request:
    paths: ["one-os/**", "bin/bashos", ".github/workflows/one-os.yml"]
  push:
    branches: [main]
    paths: ["one-os/**", "bin/bashos", ".github/workflows/one-os.yml"]
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full matrix (downloads the large ISOs; up to 4 hours)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: one-os-${{ github.ref }}
  cancel-in-progress: true

env:
  USE_DOCKER: "0"          # run natively on the runner (sudo for loop/mount)
  CI: "true"

defaults:
  run:
    working-directory: one-os

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml python3-jinja2 jq
      - run: pipx install ruff==0.14.3
      - run: make lint
      - name: No <PIN> on main
        if: github.ref == 'refs/heads/main'
        run: "! grep -n '<PIN>' manifest.yaml"

  build-test:
    name: build + fast suite
    needs: lint
    if: ${{ !inputs.full }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      apt-cache:
        image: sameersbn/apt-cacher-ng:3.7.4-20220421
        ports: ["3142:3142"]
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso mtools isolinux syslinux-common \
            qemu-system-x86 qemu-utils ovmf seabios ipxe-qemu exfatprogs exfat-fuse dosfstools e2fsprogs \
            parted gdisk rsync jq zstd python3-yaml python3-jinja2 python3-pytest python3-jsonschema python3-pil python3-markdown tesseract-ocr ipxe bzip2 lbzip2
          sudo modprobe nbd max_part=16
      - run: make fetch
      # In the builder container: Ubuntu's live-build is an older fork whose options differ from
      # Debian's (`lb config: unrecognized option '--bootloaders'`); the home base is Debian's.
      - run: make lightos USE_DOCKER=1
      - name: Give build/ back to the runner (the container wrote it as root)
        run: sudo chown -R "$(id -u):$(id -g)" build
      - run: make payload image
      - name: Fast suite (T00–T51)
        env:
          ONEOS_MIRROR: http://localhost:3142/deb.debian.org/debian
        run: make test ARGS="-v --junitxml=build/junit.xml"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: one-os-test-runs
          path: |
            one-os/build/test-runs/**/*.log
            one-os/build/test-runs/**/*.pcap
            one-os/build/test-runs/**/*.png
            one-os/build/test-runs/**/*.json
            one-os/build/lightos-build.log
            one-os/build/junit.xml
          retention-days: 14

  full:
    name: full matrix (by hand)
    needs: lint
    if: ${{ inputs.full }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      FETCH_LARGE: "1"
    services:
      apt-cache:
        image: sameersbn/apt-cacher-ng:3.7.4-20220421
        ports: ["3142:3142"]
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso mtools isolinux syslinux-common \
            qemu-system-x86 qemu-utils ovmf seabios ipxe-qemu exfatprogs exfat-fuse dosfstools e2fsprogs \
            parted gdisk rsync jq zstd python3-yaml python3-jinja2 python3-pytest python3-jsonschema python3-pil python3-markdown tesseract-ocr ipxe bzip2 lbzip2
          sudo modprobe nbd max_part=16
      - name: Free disk space for large ISOs
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - run: make fetch
      - run: make lightos payload image
      - name: Full matrix
        env:
          ONEOS_MIRROR: http://localhost:3142/deb.debian.org/debian
        run: make test-full ARGS="-v --junitxml=build/junit.xml"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: one-os-full-${{ github.run_number }}
          path: one-os/build/junit.xml
          retention-days: 30
