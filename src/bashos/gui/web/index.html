<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bashOS — terminal-first AI runtime</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M7 10l2.5 2.5L7 15"/><path d="M13 15.5h4"/></symbol>
  <symbol id="i-slash" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 17.5l5-11"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M2.5 12.5h4l3-8 4.5 15 2.5-7h5"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M3.5 18a8.5 8.5 0 1 1 17 0"/><path d="M12 18l4.5-5.5"/><circle cx="12" cy="18" r="1.4"/></symbol>
  <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/><path d="M9.5 3v3.5M14.5 3v3.5M9.5 17.5V21M14.5 17.5V21M3 9.5h3.5M3 14.5h3.5M17.5 9.5H21M17.5 14.5H21"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.2"/><circle cx="15.5" cy="12" r="2.2"/><circle cx="8" cy="17" r="2.2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M19.5 19.5l-3.8-3.8"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.6A8.6 8.6 0 0 1 9.4 4 8.6 8.6 0 1 0 20 14.6z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 4.8l11 7.2-11 7.2z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11.5" height="11.5" rx="2"/><path d="M5.5 15.5V5.5a2 2 0 0 1 2-2H15"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 1 0-2.2 6.1"/><path d="M20.5 5v6h-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 2.5L4.5 14h6.2l-1 7.5L19 10h-6.2z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
</svg>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <span class="brand-prompt">▸</span>
      </div>
      <div class="brand-text">
        <strong>bashOS</strong>
        <span data-bind="brand-sub">terminal-first AI runtime</span>
      </div>
    </div>

    <div class="project" data-action="scene:engine" role="button" tabindex="0">
      <span class="project-dot" data-bind="engine-dot"></span>
      <span class="project-body">
        <span class="project-name" data-bind="backend">…</span>
        <span class="project-meta" data-bind="model">…</span>
      </span>
      <span class="project-swap">engine</span>
    </div>

    <nav class="nav" data-bind="nav"></nav>

    <div class="sidebar-foot">
      <button class="btn btn--ghost btn--sm" data-action="palette">
        <svg class="ic"><use href="#i-search"/></svg>
        <span>Search</span>
        <kbd class="kbd" data-bind="palette-key">⌘K</kbd>
      </button>
      <div class="sidebar-note">
        the terminal is still the core<br>
        <code>bashos</code> · <code>bashos run …</code>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumbs">
        <span class="crumb-root">bashOS</span>
        <span class="crumb-sep">/</span>
        <span class="crumb-leaf" data-bind="crumb">Overview</span>
      </div>
      <div class="topbar-right">
        <span class="pill pill--quiet" data-bind="root" title="bashOS root"></span>
        <label class="switch" title="Route and render the prompt without calling a model">
          <input type="checkbox" data-bind="dry-run">
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-label">dry run</span>
        </label>
        <button class="btn btn--icon" data-action="theme" title="Toggle theme">
          <svg class="ic ic--sun"><use href="#i-sun"/></svg>
          <svg class="ic ic--moon"><use href="#i-moon"/></svg>
        </button>
      </div>
    </header>

    <div class="scene" data-bind="scene"></div>
  </main>
</div>

<div class="overlay" data-bind="palette-overlay" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette-input">
      <svg class="ic"><use href="#i-search"/></svg>
      <input type="text" data-bind="palette-query" placeholder="Run a command, jump to a scene…" autocomplete="off" spellcheck="false">
      <kbd class="kbd">esc</kbd>
    </div>
    <div class="palette-list" data-bind="palette-list"></div>
  </div>
</div>

<div class="toast" data-bind="toast" hidden></div>

<noscript class="noscript">The bashOS desktop needs JavaScript. The terminal does not: <code>bashos run /sh …</code></noscript>

<script src="/app.js" type="module"></script>
</body>
</html>
